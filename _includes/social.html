<ul class="social-media-list">
  {%- if site.social.mastodon -%}
  <li><a rel="me" href="https://infosec.exchange/@{{ site.social.mastodon | cgi_escape | escape }}" target="_blank" title="Mastodon" aria-label="Mastodon"><svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#mastodon' | relative_url }}"></use></svg></a></li>
  {%- endif -%}
  {%- if site.social.github -%}
  <li><a rel="me" href="https://github.com/{{ site.social.github | cgi_escape | escape }}" target="_blank" title="GitHub" aria-label="GitHub"><svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg></a></li>
  {%- endif -%}
  {%- if site.social.linkedin -%}
  <li><a rel="me" href="https://www.linkedin.com/in/{{ site.social.linkedin | cgi_escape | escape }}" target="_blank" title="LinkedIn" aria-label="LinkedIn"><svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg></a></li>
  {%- endif -%}
  {%- if site.social.rss -%}
  <li><a href="{{ site.social.rss | relative_url }}" title="RSS feed" aria-label="RSS feed"><svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#rss' | relative_url }}"></use></svg></a></li>
  {%- endif -%}
</ul>
