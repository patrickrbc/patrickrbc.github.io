# Site settings
title: patrickrbc
author:
  name: Patrick Costa
  url: https://patrickrbc.com/about/
description: >-
  Personal blog of Patrick Costa, a software engineer with a security
  background. Notes on software engineering, security research and things
  learned while working with computers.
lang: en
baseurl: ""
url: "https://patrickrbc.com"

social:
  # Used by the footer links (_includes/social.html)
  github: patrickrbc
  linkedin: patrickrbc
  mastodon: patrickrbc
  rss: feed.xml
  # Used by jekyll-seo-tag for structured data (JSON-LD)
  name: Patrick Costa
  links:
    - https://github.com/patrickrbc
    - https://www.linkedin.com/in/patrickrbc
    - https://infosec.exchange/@patrickrbc

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

sass:
  sourcemap: never
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions, slash-div]

disqus:
  shortname: https-patrickrbc-com

permalink: /:categories/:year/:month/:day/:title

include: [_util]

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Patrick Costa

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .bundle/
